<svg width="640" height="661" viewBox="0 0 640 661" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Response parsing pipeline</title>
<desc>parsePacket validates the header, rejects TXID mismatches and non-OK Rcodes, then walks the question, answer, authority, and additional sections, resolving compressed names via pointer jumps.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="661" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">parsePacket(buffer)</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">check buffer_size >= FixedDNSheader</text>
<line x1="320" y1="86" x2="320" y2="126" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="126" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Read FixedDNSheader</text>
<text x="320.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">TXID, flags, counts (ntohs)</text>
<line x1="320" y1="182" x2="320" y2="207" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,207.0 430.0,242 320,277.0 210.0,242" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="242" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">TXID matches sent query?</text>
<polyline points="430,242 465,242" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="465" y="217" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="540.0" y="235.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#712B13">invalid reply</text>
<text x="540.0" y="253.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">return false</text>
<text x="390" y="224" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">no</text>
<line x1="320" y1="277" x2="320" y2="287" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="336" y="262" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">yes</text>
<polygon points="320,287.0 430.0,322 320,357.0 210.0,322" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="322" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">Rcode == DNS_OK?</text>
<polyline points="210,322 205,322" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="55" y="297" width="150" height="50" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="130.0" y="315.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#712B13">query failed</text>
<text x="130.0" y="333.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">return false</text>
<text x="250" y="304" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">no</text>
<line x1="320" y1="357" x2="320" y2="367" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="336" y="342" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">yes</text>
<rect x="160.0" y="367" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="388.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Parse Questions section</text>
<text x="320.0" y="406.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">loop nQuestions, ParseName()</text>
<line x1="320" y1="423" x2="320" y2="463" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="463" width="340" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="330.0" y="492.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Parse Answers / Authority / Additional</text>
<text x="330.0" y="510.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">loop each count, ParseRecord() -> ParseName() with pointer jumps</text>
<line x1="320" y1="535" x2="320" y2="575" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="575" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="596.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">Return true</text>
<text x="320.0" y="614.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">ready for printPacket()</text>
</svg>