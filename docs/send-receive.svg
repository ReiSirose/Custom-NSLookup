<svg width="640" height="632" viewBox="0 0 640 632" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Send and receive over UDP, with retry</title>
<desc>Socket sends the query, waits on select() for up to 10 seconds, retries on timeout or on a reply from an unexpected source, and returns the raw response bytes once a matching reply arrives, up to three attempts total.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="632" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">for attempt in 0..2</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">up to DNS_MAX_ATTEMPT = 3 tries</text>
<line x1="320" y1="86" x2="320" y2="126" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="126" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Socket::Send()</text>
<text x="320.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">sendto() query packet to server:53</text>
<line x1="320" y1="182" x2="320" y2="222" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="222" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="243.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">select() on socket</text>
<text x="320.0" y="261.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">wait up to TIMEOUT_SECONDS = 10s</text>
<line x1="320" y1="278" x2="320" y2="300" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,300.0 430.0,338 320,376.0 210.0,338" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="338" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">select() result</text>
<polyline points="430,338 560,338 560,58 480.0,58" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="552" y="322" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">timeout: next attempt</text>
<line x1="320" y1="376" x2="320" y2="384" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="336" y="360" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">data ready</text>
<rect x="160.0" y="384" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Socket::Read()</text>
<text x="320.0" y="423.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">recvfrom() into m_buffer</text>
<line x1="320" y1="440" x2="320" y2="462" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,462.0 440.0,500 320,538.0 200.0,500" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="500" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">reply from correct server?</text>
<polyline points="200,500 60,500 60,58 160.0,58" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="68" y="484" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">mismatch: next attempt</text>
<line x1="320" y1="538" x2="320" y2="546" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="336" y="522" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">match</text>
<rect x="160.0" y="546" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="567.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">Return raw response bytes</text>
<text x="320.0" y="585.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">to DNSPacket::parsePacket()</text>
</svg>