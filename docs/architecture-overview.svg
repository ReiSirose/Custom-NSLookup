<svg width="640" height="566" viewBox="0 0 640 566" xmlns="http://www.w3.org/2000/svg" role="img">
<title>High-level architecture flow</title>
<desc>main.cpp decides A vs PTR lookup from the input, builds a raw DNS query packet, sends it over UDP with retries, parses the wire-format response, and prints all resource record sections.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="566" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">main.cpp</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">parse argv: domain/IP, DNS server IP</text>
<line x1="320" y1="86" x2="320" y2="111" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,108.0 440.0,146 320,184.0 200.0,146" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="146" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">host looks like an IP?</text>
<text x="190" y="101" text-anchor="end" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">yes -> PTR</text>
<text x="450" y="101" text-anchor="start" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">no -> A</text>
<line x1="320" y1="184" x2="320" y2="192" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="192" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="213.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">DNSPacket::buildQueryPacket()</text>
<text x="320.0" y="231.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">see diagram 2</text>
<line x1="320" y1="248" x2="320" y2="288" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="288" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="309.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Socket::Send_and_Recieve()</text>
<text x="320.0" y="327.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">UDP send + retry, see diagram 3</text>
<line x1="320" y1="344" x2="320" y2="384" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="384" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="405.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">DNSPacket::parsePacket()</text>
<text x="320.0" y="423.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">see diagram 4</text>
<line x1="320" y1="440" x2="320" y2="480" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="480" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="501.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">DNSPacket::printPacket()</text>
<text x="320.0" y="519.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">print questions / answers / authority / additional</text>
</svg>