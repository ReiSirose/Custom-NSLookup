<svg width="640" height="500" viewBox="0 0 640 500" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Full round-trip sequence</title>
<desc>main builds the query via DNSPacket, hands it to Socket which retries sending over UDP to the DNS server up to three times, then main parses and prints the response through DNSPacket again.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="500" fill="#ffffff"/>
<line x1="70" y1="60" x2="70" y2="470" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="230" y1="60" x2="230" y2="470" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="400" y1="60" x2="400" y2="470" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<line x1="560" y1="60" x2="560" y2="470" stroke="#c9c7bd" stroke-width="1" stroke-dasharray="3 3"/>
<text x="150.0" y="94" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">buildQueryPacket(host, type)</text>
<line x1="70" y1="100" x2="230" y2="100" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="235.0" y="144" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">Send_and_Recieve(packet, size)</text>
<line x1="70" y1="150" x2="400" y2="150" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="150" y="180" width="450" height="140" fill="none" stroke="#8a8880" stroke-width="1" stroke-dasharray="2 2"/><path d="M150 180 L220 180 L208 196 L150 196 Z" fill="#F1EFE8" stroke="#8a8880" stroke-width="1"/><text x="158" y="191" font-family="Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2C2C2A">loop: up to 3 attempts, 10s timeout each</text>
<text x="480.0" y="219" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">sendto() UDP query</text>
<line x1="400" y1="225" x2="560" y2="225" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="480.0" y="269" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">UDP response (or timeout)</text>
<line x1="560" y1="275" x2="400" y2="275" stroke="#3d3d3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="235.0" y="354" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">raw response bytes</text>
<line x1="400" y1="360" x2="70" y2="360" stroke="#3d3d3a" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="150.0" y="404" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">parsePacket(buffer)</text>
<line x1="70" y1="410" x2="230" y2="410" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="150.0" y="454" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#3d3d3a">printPacket()</text>
<line x1="70" y1="460" x2="230" y2="460" stroke="#3d3d3a" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="10.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="70" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">M</text>
<rect x="170.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="230" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Pkt</text>
<rect x="340.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="400" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Sk</text>
<rect x="500.0" y="20" width="120" height="40" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/><text x="560" y="40" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#2C2C2A">Srv</text>
</svg>