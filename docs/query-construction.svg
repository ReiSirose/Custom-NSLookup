<svg width="640" height="588" viewBox="0 0 640 588" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Query packet construction</title>
<desc>DNSPacket builds the fixed header, then encodes the question name differently for A lookups (direct label encoding) versus PTR lookups (reversed IP octets under in-addr.arpa), before appending the query type and class.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#8a8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="588" fill="#ffffff"/>
<rect x="160.0" y="30" width="320" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="320.0" y="51.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0C447C">DNSPacket constructor</text>
<text x="320.0" y="69.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#185FA5">generate random TXID, seed by time</text>
<line x1="320" y1="86" x2="320" y2="126" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="126" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="147.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Fill FixedDNSheader</text>
<text x="320.0" y="165.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">TXID, RD flag, nQuestions = 1, rest = 0</text>
<line x1="320" y1="182" x2="320" y2="204" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polygon points="320,204.0 420.0,242 320,280.0 220.0,242" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="320" y="242" text-anchor="middle" dominant-baseline="central" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#633806">queryType</text>
<polyline points="220,242 160.0,242 160.0,288" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polyline points="420,242 480.0,242 480.0,288" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="160.0" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">DNS_A</text>
<text x="480.0" y="232" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#993C1D">DNS_PTR</text>
<rect x="30" y="288" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="160.0" y="317.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#085041">makeDNSQuestion(host)</text>
<text x="160.0" y="335.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">encode labels directly, e.g. 3www6google3com0</text>
<rect x="350" y="288" width="260" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="480.0" y="317.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#085041">reverse octets + in-addr.arpa</text>
<text x="480.0" y="335.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#0F6E56">then makeDNSQuestion() on that string</text>
<polyline points="160.0,360 160.0,392 320,392 320,406" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<polyline points="480.0,360 480.0,392 320,392 320,406" fill="none" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="406" width="320" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="320.0" y="427.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Append QueryHeader</text>
<text x="320.0" y="445.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5F5E5A">qType + qClass (IN)</text>
<line x1="320" y1="462" x2="320" y2="502" stroke="#8a8880" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="160.0" y="502" width="320" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="320.0" y="523.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#26215C">Return packet size</text>
<text x="320.0" y="541.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#534AB7">header + question + qtype/qclass</text>
</svg>